debug: true
machine:
  registries:
    mirrors:
      "docker.io":
        endpoint:
          - "http://zot-registry.zot-system.svc.cluster.local:5000"
      "*":
        endpoint:
          - "http://zot-registry.zot-system.svc.cluster.local:5000"
    configs:
      "zot-registry.zot-system.svc.cluster.local:5000":
        tls:
          insecure_skip_verify: true
  install:
    disk: /dev/nvme0n1
    wipe: true
kubelet:
  extraMounts:
    - destination: /var/lib/longhorn
      type: bind
      source: /var/lib/longhorn
      options:
        - bind
        - rshared
        - rw
