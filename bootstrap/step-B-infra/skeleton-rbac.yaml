apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forgejo-git-access
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["forgejo-proxy-access"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forgejo-git-access-binding
subjects:
  # Skeleton binding - will be populated by Flux later
  - kind: ServiceAccount
    name: placeholder-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: forgejo-git-access
  apiGroup: rbac.authorization.k8s.io
