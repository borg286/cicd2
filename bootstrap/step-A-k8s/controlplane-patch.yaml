# controlplane-patch.yaml
machine:
  registries:
    mirrors:
      docker.io:
        endpoints:
          - "http://zot-registry.zot-system.svc.cluster.local:5000"
      "*":
        endpoints:
          - "http://zot-registry.zot-system.svc.cluster.local:5000"
    config:
      "zot-registry.zot-system.svc.cluster.local:5000":
        tls:
          # Remove insecure_skip_verify if it's not a valid key
          # or use the correct schema for registry TLS config
  install:
    disk: /dev/nvme0n1
    wipe: true
  kubelet:
    extraMounts:
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options:
          - bind
          - rshared
          - rw