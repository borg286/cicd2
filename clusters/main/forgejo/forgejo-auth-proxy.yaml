apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-krbp-config
  namespace: forgejo
data:
  config.yaml: |
    authorization:
      resourceAttributes:
        namespace: forgejo
        apiVersion: v1
        resource: configmaps
        name: forgejo-proxy-access
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-nginx-transformer
  namespace: forgejo
data:
  nginx.conf: |
    events {}
    http {
      # Mapping system:serviceaccount:NAMESPACE:NAME to NAMESPACE-NAME
      map $http_x_remote_user $forgejo_username {
        "~^system:serviceaccount:([^:]+):(.+)$"  $1-$2;
        default                                  $http_x_remote_user;
      }

      server {
        listen 8082;

        location / {
          proxy_set_header  X-Webauth-User   $forgejo_username;
          proxy_set_header  x-remote-user    "";
          proxy_set_header  x-remote-groups  "";

          proxy_request_buffering off;
          proxy_buffering         off;
          proxy_read_timeout      300s;

          proxy_pass http://127.0.0.1:3000;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo-auth-gateway
  namespace: forgejo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/name: forgejo
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forgejo-token-reviewer
subjects:
  - kind: ServiceAccount
    name: forgejo
    namespace: forgejo
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
