apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: forgejo-chart
    namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    gitea:
      admin:
        existingSecret: forgejo-admin
        email: "admin@example.com"
      config:
        server:
          HTTP_ADDR: 0.0.0.0
          HTTP_PORT: 3000
          # Using the native forgejo service address as the root URL
          ROOT_URL: "http://forgejo.forgejo.svc.cluster.local:3000"
        service:
          DISABLE_REGISTRATION: false # Allow auto-registration to work
          ENABLE_REVERSE_PROXY_AUTHENTICATION: true
          # Trust all in-cluster sources; restrict to pod CIDR if needed
          REVERSE_PROXY_TRUSTED_PROXIES: "*"
          # Header set by the git-auth-gateway proxy
          REVERSE_PROXY_AUTHENTICATION_USER: X-WEBAUTH-USER

    serviceAccount:
      create: true
      name: forgejo
      automountServiceAccountToken: true



    persistence:
      enabled: true
      size: 10Gi
