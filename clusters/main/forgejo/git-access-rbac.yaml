apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forgejo-git-access
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["forgejo-proxy-access"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forgejo-git-access-binding
subjects:
  - kind: ServiceAccount
    name: code-server-sa
    namespace: borg286
  # Add other users here as needed
roleRef:
  kind: ClusterRole
  name: forgejo-git-access
  apiGroup: rbac.authorization.k8s.io
